name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Проверка сборки
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Включить Corepack
        run: corepack enable

      - name: Обновить зависимости
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Зафиксировать yarn.lock
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock уже актуален"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: обновить yarn.lock"
          git push

      - name: Проверить обычную сборку
        run: yarn build

      - name: Проверить WordPress-сборку
        run: yarn build:wp
