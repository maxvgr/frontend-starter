name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Проверка сборки
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Включить Corepack
        run: corepack enable

      - name: Обновить зависимости
        run: yarn install

      - name: Сохранить обновлённый yarn.lock
        uses: actions/upload-artifact@v4
        with:
          name: generated-yarn-lock
          path: yarn.lock

      - name: Проверить обычную сборку
        run: yarn build

      - name: Проверить WordPress-сборку
        run: yarn build:wp
